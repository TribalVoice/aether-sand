<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aether Sand — Granular Ambient</title>
<style>
  :root {
    --bg: #0a0c0e;
    --wet: #1a2429;
    --grain: #2c3a42;
    --sheen: #4a5c68;
    --accent: #7a9aaa;
    --text: #c5d0d6;
    --wet-highlight: #8ba8b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.2rem 1.5rem;
    background: linear-gradient(180deg, #0f1418 0%, #0a0c0e 100%);
    border-bottom: 1px solid #1e2a30;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    margin: 0;
    font-weight: 300;
    letter-spacing: 0.15em;
    font-size: 1.4rem;
    color: var(--wet-highlight);
  }
  .subtitle { font-size: 0.8rem; opacity: 0.6; letter-spacing: 0.08em; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 1rem;
    padding: 1rem;
  }
  #canvas-wrap {
    background: linear-gradient(160deg, #0d1215 0%, #151c21 40%, #0f161a 100%);
    border: 1px solid #1e2a30;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
  }
  #waveform {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  #particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .controls {
    background: #101418;
    border: 1px solid #1e2a30;
    border-radius: 8px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
  }
  label {
    display: flex;
    flex-direction: column;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--sheen);
    gap: 0.3rem;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #1a2429;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(122,154,170,0.4);
  }
  button, select, input[type="file"] {
    background: #1a2429;
    color: var(--text);
    border: 1px solid #2c3a42;
    border-radius: 4px;
    padding: 0.5rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:hover, select:hover { background: #243038; }
  button.active { background: #2a4a5a; border-color: var(--accent); }
  .row { display: flex; gap: 0.5rem; }
  .row > * { flex: 1; }
  footer {
    padding: 0.6rem 1.5rem;
    font-size: 0.75rem;
    opacity: 0.5;
    border-top: 1px solid #1e2a30;
  }
  .value { float: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  .section-title {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--wet-highlight);
    margin: 0.4rem 0 0.2rem;
    opacity: 0.8;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>AETHER SAND</h1>
    <div class="subtitle">granular ambient · wet grains · massive reverb</div>
  </div>
  <div>
    <input type="file" id="file" accept="audio/*">
  </div>
</header>

<main>
  <div id="canvas-wrap">
    <canvas id="waveform"></canvas>
    <canvas id="particles"></canvas>
  </div>
  <aside class="controls">
    <div class="row">
      <button id="play">Play</button>
    </div>
    <label>Mode
      <select id="mode">
        <option value="haze">Haze</option>
        <option value="tunnel">Tunnel</option>
        <option value="freeze">Freeze</option>
      </select>
    </label>
    <label>Grain Size <span class="value" id="sizeVal">60 ms</span>
      <input type="range" id="size" min="10" max="200" value="60">
    </label>
    <label>Density <span class="value" id="densityVal">12 /s</span>
      <input type="range" id="density" min="2" max="40" value="12">
    </label>
    <label>Spread <span class="value" id="spreadVal">0.08</span>
      <input type="range" id="spread" min="0" max="0.4" step="0.01" value="0.08">
    </label>
    <label>Pitch <span class="value" id="pitchVal">1.00</span>
      <input type="range" id="pitch" min="0.25" max="2" step="0.01" value="1">
    </label>
    <label>Smear <span class="value" id="smearVal">0.00</span>
      <input type="range" id="smear" min="0" max="1" step="0.01" value="0">
    </label>
    <label>Volume <span class="value" id="volVal">0.7</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </label>

    <div class="section-title">NOTE FILTER</div>
    <label>Freq <span class="value" id="noteFreqVal">440 Hz</span>
      <input type="range" id="noteFreq" min="40" max="2000" step="1" value="440">
    </label>
    <label>Resonance <span class="value" id="noteQVal">4.0</span>
      <input type="range" id="noteQ" min="0.5" max="12" step="0.1" value="4">
    </label>
    <label>Cut <span class="value" id="noteCutVal">0 dB</span>
      <input type="range" id="noteCut" min="-30" max="0" step="0.5" value="0">
    </label>

    <div class="section-title">MASSIVE REVERB</div>
    <label>Mix <span class="value" id="reverbMixVal">0.40</span>
      <input type="range" id="reverbMix" min="0" max="1" step="0.01" value="0.40">
    </label>
    <label>Decay <span class="value" id="decayVal">14 s</span>
      <input type="range" id="decay" min="2" max="40" step="0.5" value="14">
    </label>
    <label>Density <span class="value" id="revDensityVal">0.90</span>
      <input type="range" id="revDensity" min="0.2" max="1" step="0.01" value="0.90">
    </label>
    <label>Tone <span class="value" id="toneVal">2.2 kHz</span>
      <input type="range" id="tone" min="400" max="10000" step="100" value="2200">
    </label>

    <button id="resetPos">Center Position</button>

    <div class="section-title">MIDI</div>
    <button id="midiEnable">Enable MIDI In</button>
    <div id="midiStatus" style="font-size:0.72rem;opacity:0.65;letter-spacing:0.03em;">Not connected</div>

    <div class="section-title">PRESETS</div>
    <select id="presetSelect"><option value="">— select preset —</option></select>
    <div class="row">
      <input type="text" id="presetName" placeholder="Name" style="flex:2;padding:0.5rem;">
      <button id="savePreset">Save</button>
    </div>
    <div class="row">
      <button id="loadPreset">Load</button>
      <button id="deletePreset">Delete</button>
    </div>

    <div class="section-title">HQ EXPORT</div>
    <button id="record">Record WAV</button>
    <div id="recordStatus" style="font-size:0.72rem;opacity:0.65;">Ready</div>
  </aside>
</main>
<footer>Click / drag on the waveform to set grain position · Aether Sand + Massive Reverb</footer>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const outputGain = audioCtx.createGain();
outputGain.connect(audioCtx.destination);
outputGain.gain.value = 0.7;

// Reverb graph
const dryGain = audioCtx.createGain();
const wetGain = audioCtx.createGain();
const convolver = audioCtx.createConvolver();
const reverbFilter = audioCtx.createBiquadFilter();
reverbFilter.type = 'lowpass';
reverbFilter.frequency.value = 2200;
reverbFilter.Q.value = 0.5;

// Optional gentle high-pass used only to reduce tonal dominance when smearing Freeze
const smearHP = audioCtx.createBiquadFilter();
smearHP.type = 'highpass';
smearHP.frequency.value = 20;   // essentially bypassed at default
smearHP.Q.value = 0.7;

// Tunable resonant peaking filter to cut a prominent note
const noteFilter = audioCtx.createBiquadFilter();
noteFilter.type = 'peaking';
noteFilter.frequency.value = 440;
noteFilter.Q.value = 4;
noteFilter.gain.value = 0;

// Permanent routing: grains → smearHP → noteFilter → dry & reverb
smearHP.connect(noteFilter);
noteFilter.connect(dryGain);
noteFilter.connect(convolver);

dryGain.connect(outputGain);
wetGain.connect(outputGain);
convolver.connect(reverbFilter);
reverbFilter.connect(wetGain);

let buffer = null;
let isPlaying = false;
let position = 0.5; // 0–1
let grainSize = 0.06; // seconds
let density = 12; // grains per second
let spread = 0.08;
let pitch = 1.0;
let mode = 'haze';
let smear = 0;          // 0 = pure freeze drone, >0 reduces tonal dominance
let noteFreq = 440;
let noteQ = 4;
let noteCut = 0;        // dB, negative cuts the note
let grainTimer = null;
let activeGrains = 0;
let walkOffset = 0;

// Reverb params
let reverbMix = 0.40;
let reverbDecay = 14;
let reverbDensity = 0.90;
let reverbTone = 2200;

const waveformCanvas = document.getElementById('waveform');
const particlesCanvas = document.getElementById('particles');
const wctx = waveformCanvas.getContext('2d');
const pctx = particlesCanvas.getContext('2d');

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  waveformCanvas.width = particlesCanvas.width = wrap.clientWidth;
  waveformCanvas.height = particlesCanvas.height = wrap.clientHeight;
  drawWaveform();
}
window.addEventListener('resize', resize);
resize();

// Particle system for wet sand grains
const particles = [];
function spawnParticle(x, intensity) {
  // Widen the falling path according to the Spread control (0–0.4)
  const spreadPx = spread * waveformCanvas.width * 2.4;
  const offsetX = (Math.random() - 0.5) * spreadPx;
  // Stronger horizontal drift when Spread is higher
  const vxScale = 0.12 + spread * 5.5;
  const h = particlesCanvas.height || 400;
  // Moderate fall speed
  const vy = Math.random() * 0.9 + 0.55;
  // Frames needed to cross the full window (plus a little margin)
  const framesToCross = (h + 30) / vy;
  particles.push({
    x: x + offsetX,
    y: -8,
    vx: (Math.random() - 0.5) * vxScale,
    vy,
    life: 1,
    maxLife: framesToCross,
    size: Math.random() * 1.8 + 0.6,
    intensity
  });
}
function updateParticles() {
  pctx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
  const h = particlesCanvas.height;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    // Decay life so the particle lasts exactly long enough to cross the window
    p.life -= 1 / Math.max(60, p.maxLife);
    if (p.life <= 0 || p.y > h + 15) {
      particles.splice(i, 1);
      continue;
    }
    const alpha = Math.min(1, p.life * 1.2) * 0.85 * p.intensity;
    pctx.fillStyle = `rgba(190, 220, 235, ${alpha})`;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pctx.fill();
  }
  requestAnimationFrame(updateParticles);
}
updateParticles();

function drawWaveform() {
  wctx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
  const grad = wctx.createLinearGradient(0, 0, 0, waveformCanvas.height);
  grad.addColorStop(0, '#0d1418');
  grad.addColorStop(0.5, '#121a1f');
  grad.addColorStop(1, '#0a1014');
  wctx.fillStyle = grad;
  wctx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);

  if (!buffer) {
    wctx.fillStyle = '#2c3a42';
    wctx.font = '14px system-ui';
    wctx.textAlign = 'center';
    wctx.fillText('Load an audio file to begin', waveformCanvas.width / 2, waveformCanvas.height / 2);
    return;
  }

  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / waveformCanvas.width);
  const amp = waveformCanvas.height / 2.4;
  wctx.beginPath();
  wctx.strokeStyle = '#4a5c68';
  wctx.lineWidth = 1.2;
  for (let i = 0; i < waveformCanvas.width; i++) {
    let min = 1, max = -1;
    for (let j = 0; j < step; j++) {
      const idx = Math.floor((i * step + j));
      if (idx < data.length) {
        const val = data[idx];
        if (val < min) min = val;
        if (val > max) max = val;
      }
    }
    const y1 = (1 + min) * amp;
    const y2 = (1 + max) * amp;
    wctx.moveTo(i, waveformCanvas.height / 2 - y1 / 2);
    wctx.lineTo(i, waveformCanvas.height / 2 + y2 / 2);
  }
  wctx.stroke();

  const px = position * waveformCanvas.width;
  wctx.strokeStyle = '#7a9aaa';
  wctx.lineWidth = 2;
  wctx.beginPath();
  wctx.moveTo(px, 0);
  wctx.lineTo(px, waveformCanvas.height);
  wctx.stroke();
  wctx.fillStyle = 'rgba(122, 154, 170, 0.15)';
  wctx.fillRect(px - 8, 0, 16, waveformCanvas.height);
}

// Interaction
let dragging = false;
function setPositionFromEvent(e) {
  const rect = waveformCanvas.getBoundingClientRect();
  const x = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
  position = Math.max(0, Math.min(1, x / rect.width));
  drawWaveform();
}
waveformCanvas.addEventListener('mousedown', e => { dragging = true; setPositionFromEvent(e); });
window.addEventListener('mousemove', e => { if (dragging && mode !== 'freeze') setPositionFromEvent(e); });
window.addEventListener('mouseup', () => dragging = false);
waveformCanvas.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; setPositionFromEvent(e); }, {passive:false});
window.addEventListener('touchmove', e => { if (dragging && mode !== 'freeze') { e.preventDefault(); setPositionFromEvent(e); } }, {passive:false});
window.addEventListener('touchend', () => dragging = false);

// Controls
const els = {
  play: document.getElementById('play'),
  mode: document.getElementById('mode'),
  size: document.getElementById('size'),
  density: document.getElementById('density'),
  spread: document.getElementById('spread'),
  pitch: document.getElementById('pitch'),
  smear: document.getElementById('smear'),
  volume: document.getElementById('volume'),
  noteFreq: document.getElementById('noteFreq'),
  noteQ: document.getElementById('noteQ'),
  noteCut: document.getElementById('noteCut'),
  resetPos: document.getElementById('resetPos'),
  file: document.getElementById('file'),
  reverbMix: document.getElementById('reverbMix'),
  decay: document.getElementById('decay'),
  revDensity: document.getElementById('revDensity'),
  tone: document.getElementById('tone')
};

function updateLabels() {
  document.getElementById('sizeVal').textContent = Math.round(grainSize * 1000) + ' ms';
  document.getElementById('densityVal').textContent = density + ' /s';
  document.getElementById('spreadVal').textContent = spread.toFixed(2);
  document.getElementById('pitchVal').textContent = pitch.toFixed(2);
  document.getElementById('smearVal').textContent = smear.toFixed(2);
  document.getElementById('volVal').textContent = outputGain.gain.value.toFixed(2);
  document.getElementById('noteFreqVal').textContent = noteFreq + ' Hz';
  document.getElementById('noteQVal').textContent = noteQ.toFixed(1);
  document.getElementById('noteCutVal').textContent = noteCut + ' dB';
  document.getElementById('reverbMixVal').textContent = reverbMix.toFixed(2);
  document.getElementById('decayVal').textContent = reverbDecay.toFixed(0) + ' s';
  document.getElementById('revDensityVal').textContent = reverbDensity.toFixed(2);
  document.getElementById('toneVal').textContent = (reverbTone / 1000).toFixed(1) + ' kHz';
}

els.size.oninput = () => { grainSize = els.size.value / 1000; updateLabels(); };
els.density.oninput = () => { density = +els.density.value; updateLabels(); };
els.spread.oninput = () => { spread = +els.spread.value; updateLabels(); };
els.pitch.oninput = () => { pitch = +els.pitch.value; updateLabels(); };
els.smear.oninput = () => { 
  smear = +els.smear.value; 
  updateSmearFilter();
  updateLabels(); 
};
els.volume.oninput = () => { outputGain.gain.value = +els.volume.value; updateLabels(); };
els.noteFreq.oninput = () => {
  noteFreq = +els.noteFreq.value;
  noteFilter.frequency.setTargetAtTime(noteFreq, audioCtx.currentTime, 0.02);
  updateLabels();
};
els.noteQ.oninput = () => {
  noteQ = +els.noteQ.value;
  noteFilter.Q.setTargetAtTime(noteQ, audioCtx.currentTime, 0.02);
  updateLabels();
};
els.noteCut.oninput = () => {
  noteCut = +els.noteCut.value;
  noteFilter.gain.setTargetAtTime(noteCut, audioCtx.currentTime, 0.02);
  updateLabels();
};
els.mode.onchange = () => { 
  mode = els.mode.value; 
  updateSmearFilter();
};
function updateSmearFilter() {
  const now = audioCtx.currentTime;
  if (mode === 'freeze' && smear > 0.02) {
    const hpFreq = 30 + smear * 320;
    smearHP.frequency.setTargetAtTime(hpFreq, now, 0.08);
  } else {
    smearHP.frequency.setTargetAtTime(20, now, 0.08);
  }
}
els.resetPos.onclick = () => { position = 0.5; drawWaveform(); };

els.reverbMix.oninput = () => {
  reverbMix = +els.reverbMix.value;
  updateReverbGains();
  updateLabels();
};
els.decay.oninput = () => {
  reverbDecay = +els.decay.value;
  updateReverbIR();
  updateLabels();
};
els.revDensity.oninput = () => {
  reverbDensity = +els.revDensity.value;
  updateReverbIR();
  updateLabels();
};
els.tone.oninput = () => {
  reverbTone = +els.tone.value;
  reverbFilter.frequency.setTargetAtTime(reverbTone, audioCtx.currentTime, 0.05);
  updateReverbIR(); // tone also affects IR darkening
  updateLabels();
};

els.play.onclick = () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isPlaying = !isPlaying;
  els.play.textContent = isPlaying ? 'Stop' : 'Play';
  els.play.classList.toggle('active', isPlaying);
  if (isPlaying) startGrains(); else stopGrains();
};

els.file.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const arrayBuffer = await file.arrayBuffer();
  buffer = await audioCtx.decodeAudioData(arrayBuffer);
  drawWaveform();
};

function startGrains() {
  if (grainTimer) clearTimeout(grainTimer);
  nextGrainTime = audioCtx.currentTime + 0.05;
  scheduleGrains();
}
function stopGrains() {
  if (grainTimer) clearTimeout(grainTimer);
  grainTimer = null;
}

let nextGrainTime = 0;
const LOOKAHEAD = 0.1;          // seconds to schedule ahead
const SCHEDULE_INTERVAL = 25;   // ms between scheduler checks

function scheduleGrains() {
  if (!isPlaying) return;
  const now = audioCtx.currentTime;
  // Schedule all grains that should occur within the lookahead window
  while (nextGrainTime < now + LOOKAHEAD) {
    spawnGrain(nextGrainTime);
    nextGrainTime += 1 / Math.max(1, density);
  }
  grainTimer = setTimeout(scheduleGrains, SCHEDULE_INTERVAL);
}

function spawnGrain(when) {
  if (!buffer || !isPlaying) return;
  const dur = buffer.duration;
  let pos = position;

  const isFreeze = mode === 'freeze';

  // Base walk; smear makes the freeze walk more active
  let walkScale = isFreeze ? 0.01 : (mode === 'haze' ? 0.003 : 0.002);
  if (isFreeze && smear > 0) {
    walkScale *= (1 + smear * 8);
  }
  const step = (Math.random() - 0.5) * spread * walkScale * (12 / Math.max(density, 1));
  walkOffset += step;

  if (!isFreeze) {
    walkOffset *= 0.994;
  } else if (smear > 0) {
    walkOffset = Math.max(-0.15, Math.min(0.15, walkOffset));
  } else {
    walkOffset = Math.max(-0.1, Math.min(0.1, walkOffset));
  }
  pos += walkOffset;

  if (!isFreeze) {
    const scatter = mode === 'haze' ? spread * 1.4 : spread * 0.25;
    pos += (Math.random() - 0.5) * scatter * 2;
  } else if (smear > 0.05) {
    pos += (Math.random() - 0.5) * spread * smear * 1.2;
  }

  pos = Math.max(0, Math.min(1, pos));

  let effectiveGrainSize = grainSize;
  if (isFreeze && smear > 0) {
    effectiveGrainSize *= (1 - smear * 0.45);
    effectiveGrainSize = Math.max(0.012, effectiveGrainSize);
  }

  const offset = Math.max(0, Math.min(dur - effectiveGrainSize, pos * (dur - effectiveGrainSize)));

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  let pitchJitter = 1;
  if (mode === 'haze') {
    pitchJitter = 0.96 + Math.random() * 0.08;
  } else if (isFreeze && smear > 0) {
    const amount = smear * 0.09;
    pitchJitter = 1 + (Math.random() - 0.5) * 2 * amount;
  }
  src.playbackRate.value = pitch * pitchJitter;

  const g = audioCtx.createGain();
  const attack = Math.min(0.025, effectiveGrainSize * 0.3);
  const release = Math.min(0.06, effectiveGrainSize * 0.5);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.85, when + attack);
  g.gain.setValueAtTime(0.85, when + effectiveGrainSize - release);
  g.gain.linearRampToValueAtTime(0, when + effectiveGrainSize);

  src.connect(g);
  g.connect(smearHP);

  src.start(when, offset, effectiveGrainSize);
  src.onended = () => { activeGrains--; };
  activeGrains++;

  // Visual particles (still driven from main thread, but audio is now sample-accurate)
  const px = pos * waveformCanvas.width;
  const intensity = 0.7 + Math.random() * 0.3;
  spawnParticle(px, intensity);
  if (spread > 0.04 && Math.random() < spread * 2.2) {
    spawnParticle(px, intensity * 0.85);
  }
  if (spread > 0.15 && Math.random() < (spread - 0.1) * 1.8) {
    spawnParticle(px, intensity * 0.7);
  }
}

// --- Massive reverb IR generation (SuperMassive-inspired) ---
function generateMassiveIR(decayTime, density, toneHz) {
  const sampleRate = audioCtx.sampleRate;
  // Length slightly longer than decay for a clean tail
  const length = Math.floor(sampleRate * Math.min(decayTime * 1.15, 45));
  const ir = audioCtx.createBuffer(2, length, sampleRate);
  const left = ir.getChannelData(0);
  const right = ir.getChannelData(1);

  const fadeIn = Math.max(0.02, (1 - density) * 0.4); // lower density = slower attack
  const endCut = Math.max(400, Math.min(toneHz * 0.9, 8000));

  // Early reflections (sparse discrete taps)
  const earlyTaps = [
    { delay: 0.012, gain: 0.35 },
    { delay: 0.019, gain: 0.28 },
    { delay: 0.028, gain: 0.22 },
    { delay: 0.041, gain: 0.16 },
    { delay: 0.063, gain: 0.11 }
  ];

  for (let i = 0; i < length; i++) {
    const t = i / sampleRate;
    // Exponential decay to roughly -60 dB
    const env = Math.pow(10, -3 * t / decayTime);
    const fade = Math.min(1, t / fadeIn);

    // Density controls how continuous the noise is
    let nL = 0, nR = 0;
    if (Math.random() < density * 0.95 + 0.05) {
      nL = (Math.random() * 2 - 1);
      nR = (Math.random() * 2 - 1) * 0.92;
    }
    left[i] = nL * env * fade;
    right[i] = nR * env * fade;
  }

  // Add early reflections
  for (const tap of earlyTaps) {
    const idx = Math.floor(tap.delay * sampleRate);
    if (idx < length) {
      left[idx] += tap.gain * (Math.random() > 0.5 ? 1 : -1);
      right[idx] += tap.gain * 0.85 * (Math.random() > 0.5 ? 1 : -1);
    }
  }

  // Progressive one-pole lowpass (darkens over time like large spaces)
  let lpL = 0, lpR = 0;
  const startCut = Math.max(toneHz * 2.5, 6000);
  for (let i = 0; i < length; i++) {
    const t = i / sampleRate;
    const progress = Math.min(1, t / (decayTime * 0.85));
    const cut = startCut * Math.pow(endCut / startCut, progress);
    const alpha = Math.exp(-2 * Math.PI * cut / sampleRate);
    lpL = alpha * lpL + (1 - alpha) * left[i];
    lpR = alpha * lpR + (1 - alpha) * right[i];
    left[i] = lpL;
    right[i] = lpR;
  }

  // Gentle normalize to avoid clipping while keeping character
  let peak = 0;
  for (let i = 0; i < length; i++) {
    peak = Math.max(peak, Math.abs(left[i]), Math.abs(right[i]));
  }
  if (peak > 0) {
    const norm = 0.85 / peak;
    for (let i = 0; i < length; i++) {
      left[i] *= norm;
      right[i] *= norm;
    }
  }

  return ir;
}

function updateReverbIR() {
  const ir = generateMassiveIR(reverbDecay, reverbDensity, reverbTone);
  convolver.buffer = ir;
}

function updateReverbGains() {
  const now = audioCtx.currentTime;
  const dry = Math.cos(reverbMix * Math.PI / 2);
  const wet = Math.sin(reverbMix * Math.PI / 2);
  dryGain.gain.setTargetAtTime(dry, now, 0.03);
  wetGain.gain.setTargetAtTime(wet, now, 0.03);
}

// Initial setup
updateReverbIR();
updateReverbGains();
updateSmearFilter();
noteFilter.frequency.value = noteFreq;
noteFilter.Q.value = noteQ;
noteFilter.gain.value = noteCut;

// Initial draw
drawWaveform();
updateLabels();

// ========== MIDI ==========
let midiAccess = null;
const midiStatus = document.getElementById('midiStatus');

document.getElementById('midiEnable').onclick = async () => {
  try {
    midiAccess = await navigator.requestMIDIAccess();
    midiStatus.textContent = 'MIDI ready';
    midiAccess.inputs.forEach(input => {
      input.onmidimessage = onMIDIMessage;
    });
    midiAccess.onstatechange = () => {
      midiAccess.inputs.forEach(input => input.onmidimessage = onMIDIMessage);
    };
  } catch (e) {
    midiStatus.textContent = 'MIDI unavailable';
  }
};

function onMIDIMessage(e) {
  const [status, data1, data2] = e.data;
  const cmd = status >> 4;
  const ch = status & 0xf;
  if (cmd === 9 && data2 > 0) {          // Note On
    position = data1 / 127;
    drawWaveform();
  } else if (cmd === 11) {               // CC
    const v = data2 / 127;
    switch (data1) {
      case 1:  smear = v; els.smear.value = v; els.smear.oninput(); break;          // Mod → Smear
      case 7:  outputGain.gain.value = v; els.volume.value = v; updateLabels(); break; // Vol
      case 10: spread = v * 0.4; els.spread.value = spread; els.spread.oninput(); break;
      case 11: reverbMix = v; els.reverbMix.value = v; els.reverbMix.oninput(); break;
      case 71: noteQ = 0.5 + v * 11.5; els.noteQ.value = noteQ; els.noteQ.oninput(); break;
      case 72: density = 2 + v * 38; els.density.value = density; els.density.oninput(); break;
      case 73: grainSize = (10 + v * 190) / 1000; els.size.value = grainSize * 1000; els.size.oninput(); break;
      case 74: noteFreq = 40 + v * 1960; els.noteFreq.value = noteFreq; els.noteFreq.oninput(); break;
      case 75: noteCut = -v * 30; els.noteCut.value = noteCut; els.noteCut.oninput(); break;
      case 76: pitch = 0.25 + v * 1.75; els.pitch.value = pitch; els.pitch.oninput(); break;
      case 77: reverbDecay = 2 + v * 38; els.decay.value = reverbDecay; els.decay.oninput(); break;
      case 78: reverbTone = 400 + v * 9600; els.tone.value = reverbTone; els.tone.oninput(); break;
    }
  }
}

// ========== PRESETS ==========
const PRESET_KEY = 'aetherSandPresets';
function loadPresetList() {
  const sel = document.getElementById('presetSelect');
  const saved = JSON.parse(localStorage.getItem(PRESET_KEY) || '{}');
  sel.innerHTML = '<option value="">— select preset —</option>';
  Object.keys(saved).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
}
loadPresetList();

function captureState() {
  return {
    mode, grainSize, density, spread, pitch, smear,
    volume: outputGain.gain.value,
    noteFreq, noteQ, noteCut,
    reverbMix, reverbDecay, reverbDensity, reverbTone,
    position
  };
}

function applyState(s) {
  mode = s.mode; els.mode.value = mode;
  grainSize = s.grainSize; els.size.value = grainSize * 1000;
  density = s.density; els.density.value = density;
  spread = s.spread; els.spread.value = spread;
  pitch = s.pitch; els.pitch.value = pitch;
  smear = s.smear; els.smear.value = smear;
  outputGain.gain.value = s.volume; els.volume.value = s.volume;
  noteFreq = s.noteFreq; els.noteFreq.value = noteFreq;
  noteQ = s.noteQ; els.noteQ.value = noteQ;
  noteCut = s.noteCut; els.noteCut.value = noteCut;
  reverbMix = s.reverbMix; els.reverbMix.value = reverbMix;
  reverbDecay = s.reverbDecay; els.decay.value = reverbDecay;
  reverbDensity = s.reverbDensity; els.revDensity.value = reverbDensity;
  reverbTone = s.reverbTone; els.tone.value = reverbTone;
  position = s.position || 0.5;
  // trigger updates
  els.size.oninput(); els.density.oninput(); els.spread.oninput();
  els.pitch.oninput(); els.smear.oninput(); els.volume.oninput();
  els.noteFreq.oninput(); els.noteQ.oninput(); els.noteCut.oninput();
  els.reverbMix.oninput(); els.decay.oninput(); els.revDensity.oninput(); els.tone.oninput();
  updateSmearFilter();
  drawWaveform();
  updateLabels();
}

document.getElementById('savePreset').onclick = () => {
  const name = document.getElementById('presetName').value.trim();
  if (!name) return alert('Enter a preset name');
  const saved = JSON.parse(localStorage.getItem(PRESET_KEY) || '{}');
  saved[name] = captureState();
  localStorage.setItem(PRESET_KEY, JSON.stringify(saved));
  loadPresetList();
  document.getElementById('presetSelect').value = name;
};

document.getElementById('loadPreset').onclick = () => {
  const name = document.getElementById('presetSelect').value;
  if (!name) return;
  const saved = JSON.parse(localStorage.getItem(PRESET_KEY) || '{}');
  if (saved[name]) applyState(saved[name]);
};

document.getElementById('deletePreset').onclick = () => {
  const name = document.getElementById('presetSelect').value;
  if (!name || !confirm(`Delete preset “${name}”?`)) return;
  const saved = JSON.parse(localStorage.getItem(PRESET_KEY) || '{}');
  delete saved[name];
  localStorage.setItem(PRESET_KEY, JSON.stringify(saved));
  loadPresetList();
};

// ========== HQ WAV RECORDING ==========
let recording = false;
let recBuffers = [];
let recLength = 0;
let recProcessor = null;
const recordBtn = document.getElementById('record');
const recordStatus = document.getElementById('recordStatus');

function startRecording() {
  recBuffers = [];
  recLength = 0;
  const bufferSize = 4096;
  recProcessor = audioCtx.createScriptProcessor(bufferSize, 2, 2);
  outputGain.connect(recProcessor);
  recProcessor.connect(audioCtx.destination); // keep hearing it
  recProcessor.onaudioprocess = (e) => {
    if (!recording) return;
    const left = e.inputBuffer.getChannelData(0);
    const right = e.inputBuffer.getChannelData(1);
    recBuffers.push([new Float32Array(left), new Float32Array(right)]);
    recLength += left.length;
  };
  recording = true;
  recordBtn.textContent = 'Stop & Save WAV';
  recordBtn.classList.add('active');
  recordStatus.textContent = 'Recording…';
}

function stopRecording() {
  recording = false;
  if (recProcessor) {
    recProcessor.disconnect();
    recProcessor = null;
  }
  recordBtn.textContent = 'Record WAV';
  recordBtn.classList.remove('active');
  if (recLength === 0) {
    recordStatus.textContent = 'Nothing recorded';
    return;
  }
  recordStatus.textContent = 'Encoding WAV…';
  setTimeout(() => {
    const wav = encodeWAV(recBuffers, recLength, audioCtx.sampleRate);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aether-sand-${Date.now()}.wav`;
    a.click();
    URL.revokeObjectURL(url);
    recordStatus.textContent = `Saved ${(recLength / audioCtx.sampleRate).toFixed(1)}s WAV`;
    recBuffers = [];
    recLength = 0;
  }, 50);
}

recordBtn.onclick = () => recording ? stopRecording() : startRecording();

function encodeWAV(buffers, length, sampleRate) {
  const numChannels = 2;
  const bytesPerSample = 2; // 16-bit
  const blockAlign = numChannels * bytesPerSample;
  const buffer = new ArrayBuffer(44 + length * blockAlign);
  const view = new DataView(buffer);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + length * blockAlign, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);           // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);          // bits
  writeString(36, 'data');
  view.setUint32(40, length * blockAlign, true);

  let offset = 44;
  for (const [left, right] of buffers) {
    for (let i = 0; i < left.length; i++) {
      const l = Math.max(-1, Math.min(1, left[i]));
      const r = Math.max(-1, Math.min(1, right[i]));
      view.setInt16(offset, l < 0 ? l * 0x8000 : l * 0x7FFF, true);
      view.setInt16(offset + 2, r < 0 ? r * 0x8000 : r * 0x7FFF, true);
      offset += 4;
    }
  }
  return buffer;
}
